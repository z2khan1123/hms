name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
          POSTGRES_DB: hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hms:hms@localhost:5432/hms_test?schema=public
      WEB_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret-value-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-value-change-me
      NATIONAL_ID_HASH_SALT: ci-national-id-salt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@hms/shared

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=api

      - name: Sync database schema
        run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
